spring.application.name=clinica-api
server.port=8080

# Banco H2 salvo em arquivo (os dados continuam após reiniciar a aplicação)
spring.datasource.url=jdbc:h2:file:./data/clinica;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Datas no formato ISO (ex.: 2026-11-10T14:30:00)
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
