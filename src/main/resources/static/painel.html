<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Atendimento | Clínica Médica</title>
  <link rel="stylesheet" href="tema.css">
  <style>
    html, body { height: 100%; }
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100vh;
      overflow-x: hidden;
    }

    /* Cabeçalho */
    .cabecalho {
      display: flex; align-items: center; justify-content: space-between; gap: var(--esp-4); flex-wrap: wrap;
      padding: var(--esp-4) var(--esp-7); border-bottom: 1px solid var(--borda);
    }
    .cabecalho .marca svg { width: 44px; height: 44px; }
    .cabecalho .marca-nome { font-size: 1.4rem; }
    .tempo { text-align: right; }
    .tempo .hora { font-size: 2.3rem; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
    .tempo .data { font-size: .95rem; color: var(--suave); margin-top: 6px; }

    /* Conteúdo */
    main {
      display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: var(--esp-5);
      padding: clamp(16px, 2.5vh, 24px) var(--esp-7); min-height: 0;
    }
    .principal { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--esp-5); min-height: 0; }
    .cartao { border-radius: var(--raio-lg); }

    /* Chamada atual */
    .chamada {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: center;
      padding: clamp(20px, 4vh, 40px) 52px; min-height: 0;
    }
    .chamada::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--marca-clara); }
    .chamada-topo { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); flex-wrap: wrap; }
    .repeticao {
      font-size: var(--fs-sm); font-weight: 600; color: var(--st-chamada);
      border: 1px solid currentColor; border-radius: var(--raio-pilula); padding: 6px 14px;
    }
    .repeticao[hidden] { display: none; }
    .paciente {
      font-size: clamp(2.4rem, min(6vw, 9vh), 5.6rem); font-weight: 700; line-height: 1.05; letter-spacing: -.01em;
      margin: clamp(8px, 2vh, 18px) 0 clamp(14px, 3vh, 34px); overflow-wrap: anywhere;
    }
    .chamada.vazia .paciente { color: var(--suave); font-weight: 400; font-size: clamp(1.8rem, 3.6vw, 3rem); }
    .chamada.vazia .detalhes, .chamada.vazia .repeticao { display: none; }
    .detalhes { display: flex; gap: 48px; flex-wrap: wrap; align-items: flex-start; }
    .detalhes .rotulo { display: block; font-size: .9rem; color: var(--suave); margin-bottom: var(--esp-2); }
    .sala {
      display: inline-block; font-size: clamp(1.8rem, min(4vw, 6vh), 3.4rem); font-weight: 700; line-height: 1;
      padding: clamp(10px, 1.6vh, 14px) 26px; border-radius: var(--raio-md); background: var(--marca-clara); color: #04201c;
    }
    .medico { display: block; font-size: clamp(1.3rem, 2.2vw, 1.9rem); font-weight: 500; padding-top: 14px; }

    .chamada.nova { animation: realce 2.4s ease-out; }
    .chamada.nova .paciente, .chamada.nova .detalhes { animation: entrada .6s ease-out; }
    @keyframes realce {
      0% { background: #17463f; border-color: var(--marca-clara); }
      100% { background: var(--superficie); border-color: var(--borda); }
    }
    @keyframes entrada { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* Chamadas anteriores */
    .anteriores { padding: clamp(20px, 3vh, 32px) var(--esp-6) var(--esp-3); min-height: 0; overflow: hidden; }
    .anteriores ol { list-style: none; margin: 18px 0 0; padding: 0; }
    .anteriores li {
      display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center;
      padding: clamp(8px, 1.5vh, 16px) 0; border-top: 1px solid var(--borda);
    }
    .anteriores li:first-child { border-top: 0; }
    .anteriores .h { color: var(--suave); font-variant-numeric: tabular-nums; }
    .anteriores .n { font-size: 1.15rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .anteriores .s {
      font-size: .9rem; font-weight: 600; color: var(--marca-clara); border: 1px solid var(--marca-clara);
      padding: 4px 10px; border-radius: var(--raio-sm); white-space: nowrap;
    }
    .anteriores li.sem-itens { display: block; color: var(--suave); }

    /* Consultórios */
    .salas-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--esp-4); margin-top: 14px; }
    .sala-card { padding: clamp(12px, 1.8vh, 18px) 20px; display: flex; flex-direction: column; gap: 6px; border-radius: var(--raio-md); }
    .sala-card .topo { display: flex; justify-content: space-between; align-items: center; gap: var(--esp-2); }
    .sala-card .nome-sala { font-size: 1.15rem; font-weight: 700; }
    .sala-card .prof { color: var(--suave); }
    .sala-card .prox { color: var(--suave); font-size: var(--fs-sm); }

    /* Rodapé */
    .rodape {
      display: flex; align-items: center; gap: var(--esp-5); padding: var(--esp-3) var(--esp-7);
      border-top: 1px solid var(--borda); background: var(--superficie-2); color: var(--suave);
    }
    .aviso { flex: 1; min-width: 0; transition: opacity .5s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .controles { display: flex; gap: var(--esp-2); transition: opacity .4s; }
    /* Em exibição na TV os controles somem após alguns segundos sem uso do mouse ou teclado */
    body.ocioso .controles { opacity: 0; }
    body.ocioso { cursor: none; }
    .controles:focus-within { opacity: 1 !important; }

    @media (max-width: 900px) {
      body { height: auto; min-height: 100vh; }
      .principal { grid-template-columns: 1fr; }
      .cabecalho, main, .rodape { padding-left: var(--esp-4); padding-right: var(--esp-4); }
      .chamada { padding: var(--esp-6) 28px; min-height: 260px; }
      .paciente { font-size: clamp(2.2rem, 9vw, 3.4rem); }
      .sala { font-size: 2rem; }
      .rodape { flex-wrap: wrap; }
      .aviso { flex-basis: 100%; order: 3; white-space: normal; }
    }
  </style>
</head>
<body>

<header class="cabecalho">
  <div class="marca">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="12" fill="#2bb5a3"/>
      <path d="M20 11h8v9h9v8h-9v9h-8v-9h-9v-8h9z" fill="#0a121c"/>
    </svg>
    <div>
      <div class="marca-nome">Clínica Médica</div>
      <div class="marca-sub">Painel de atendimento</div>
    </div>
  </div>
  <div class="tempo">
    <div class="hora" id="hora">--:--</div>
    <div class="data" id="data"></div>
  </div>
</header>

<main>
  <div class="principal">
    <section class="cartao chamada vazia" id="chamada" aria-labelledby="tituloChamada" aria-live="assertive" aria-atomic="true">
      <div class="chamada-topo">
        <h1 class="titulo-secao" id="tituloChamada">Chamada atual</h1>
        <span class="repeticao" id="repeticao" hidden></span>
      </div>
      <div class="paciente" id="paciente">Aguardando a próxima chamada</div>
      <div class="detalhes">
        <div>
          <span class="rotulo">Dirija-se à</span>
          <span class="sala" id="sala"></span>
        </div>
        <div>
          <span class="rotulo">Profissional</span>
          <span class="medico" id="medico"></span>
        </div>
      </div>
    </section>

    <section class="cartao anteriores" aria-labelledby="tituloAnteriores">
      <h2 class="titulo-secao" id="tituloAnteriores">Chamadas anteriores</h2>
      <ol id="anteriores"><li class="sem-itens">Nenhuma chamada registrada.</li></ol>
    </section>
  </div>

  <section aria-labelledby="tituloSalas">
    <h2 class="titulo-secao" id="tituloSalas">Consultórios</h2>
    <div class="salas-grade" id="salas"></div>
  </section>
</main>

<footer class="rodape">
  <span class="conexao" id="conexao" role="status"><i aria-hidden="true"></i><span id="conexaoTexto">Conectando</span></span>
  <span class="aviso" id="aviso"></span>
  <div class="controles">
    <button class="btn btn-fantasma" id="btnSom" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H2v6h4l5 4V5z"/>
        <path id="iconeSom" d="M23 9l-6 6M17 9l6 6"/>
      </svg>
      <span>Aviso sonoro</span>
    </button>
    <button class="btn btn-fantasma" id="btnTela" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
      <span>Tela cheia</span>
    </button>
  </div>
</footer>

<script>
  const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/painel';
  const AVISOS = [
    'Tenha em mãos um documento oficial com foto e a carteirinha do convênio.',
    'Idosos, gestantes e pessoas com deficiência têm atendimento preferencial.',
    'Em caso de dúvida, procure a recepção.',
    'Mantenha o celular no modo silencioso durante a consulta.'
  ];

  const anteriores = [];
  const chamadasPorConsulta = new Map();
  let medicos = [];
  let consultasHoje = [];
  let somAtivo = false;

  const $ = (id) => document.getElementById(id);
  const hojeISO = () => new Date().toLocaleDateString('sv-SE');
  const horaCurta = (d) => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  // ---------- WebSocket ----------
  function conectar() {
    const ws = new WebSocket(WS_URL);
    ws.onopen = () => { definirConexao(true); carregarSalas(); };
    ws.onclose = () => { definirConexao(false); setTimeout(conectar, 3000); };
    ws.onmessage = (evento) => {
      if (evento.data === 'pong') return;
      const msg = JSON.parse(evento.data);
      if (msg.tipo === 'CHAMADA') exibirChamada(msg);
      atualizarConsulta(msg.consulta);
    };
  }

  function definirConexao(online) {
    $('conexao').classList.toggle('on', online);
    $('conexaoTexto').textContent = online ? 'Conectado' : 'Sem conexão, tentando novamente';
  }

  // ---------- Chamada atual ----------
  function exibirChamada(msg) {
    const c = msg.consulta;
    const vezes = (chamadasPorConsulta.get(c.id) || 0) + 1;
    chamadasPorConsulta.set(c.id, vezes);

    const painel = $('chamada');
    painel.classList.remove('vazia', 'nova');
    void painel.offsetWidth; // reinicia a animação
    painel.classList.add('nova');

    $('paciente').textContent = c.paciente.nome;
    $('sala').textContent = c.medico.sala || 'Recepção';
    $('medico').textContent = c.medico.nome;
    $('repeticao').textContent = vezes + 'ª chamada';
    $('repeticao').hidden = vezes < 2;

    // Se o paciente já estava na lista (nova chamada), remove a entrada antiga
    const repetida = anteriores.findIndex(a => a.id === c.id);
    if (repetida >= 0) anteriores.splice(repetida, 1);
    anteriores.unshift({ id: c.id, hora: horaCurta(msg.momento), nome: c.paciente.nome, sala: c.medico.sala || '' });
    anteriores.splice(7);
    desenharAnteriores();

    if (somAtivo) tocarAviso(c);
  }

  function desenharAnteriores() {
    // A primeira da lista é a chamada atual, então começa da segunda
    const itens = anteriores.slice(1);
    const lista = $('anteriores');
    if (itens.length === 0) {
      lista.innerHTML = '<li class="sem-itens">Nenhuma chamada registrada.</li>';
      return;
    }
    lista.replaceChildren(...itens.map(a => {
      const li = document.createElement('li');
      li.append(span('h', a.hora), span('n', a.nome), span('s', a.sala));
      return li;
    }));
  }

  function span(classe, texto) {
    const s = document.createElement('span');
    s.className = classe; s.textContent = texto;
    return s;
  }

  // ---------- Situação dos consultórios ----------
  async function carregarSalas() {
    try {
      const [rm, rc] = await Promise.all([fetch('/api/medicos'), fetch('/api/consultas?data=' + hojeISO())]);
      medicos = await rm.json();
      consultasHoje = await rc.json();
      desenharSalas();
    } catch (e) { /* servidor indisponível: tenta de novo na reconexão */ }
  }

  function atualizarConsulta(consulta) {
    const i = consultasHoje.findIndex(c => c.id === consulta.id);
    if (i >= 0) consultasHoje[i] = consulta; else consultasHoje.push(consulta);
    desenharSalas();
  }

  function desenharSalas() {
    const agora = Date.now();
    const ordenados = medicos.filter(m => m.sala)
      .sort((a, b) => a.sala.localeCompare(b.sala, 'pt-BR', { numeric: true }));
    const cards = ordenados.map(m => {
      const doMedico = consultasHoje.filter(c => c.medico.id === m.id);
      // Usa as mesmas cores de status da recepção
      let situacao = ['LIVRE', 'Disponível'];
      if (doMedico.some(c => c.status === 'EM_ATENDIMENTO')) situacao = ['EM_ATENDIMENTO', 'Em atendimento'];
      else if (doMedico.some(c => c.status === 'CHAMADA')) situacao = ['CHAMADA', 'Aguardando paciente'];

      const proxima = doMedico
        .filter(c => c.status === 'AGENDADA' && new Date(c.dataHora).getTime() >= agora - 30 * 60000)
        .sort((a, b) => a.dataHora.localeCompare(b.dataHora))[0];

      const card = document.createElement('div');
      card.className = 'cartao sala-card';
      const topo = document.createElement('div');
      topo.className = 'topo';
      topo.append(span('nome-sala', m.sala), span('pilula st-' + situacao[0], situacao[1]));
      card.append(topo, span('prof', m.nome),
                  span('prox', proxima ? 'Próximo horário: ' + horaCurta(proxima.dataHora) : 'Nenhum horário pendente hoje'));
      return card;
    });
    $('salas').replaceChildren(...cards);
  }

  // ---------- Som ----------
  function tocarAviso(c) {
    try {
      const ctx = new AudioContext();
      [[659.25, 0], [523.25, 0.45]].forEach(([freq, inicio]) => {
        const osc = ctx.createOscillator();
        const ganho = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t = ctx.currentTime + inicio;
        ganho.gain.setValueAtTime(0.0001, t);
        ganho.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        ganho.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
        osc.connect(ganho).connect(ctx.destination);
        osc.start(t); osc.stop(t + 1.25);
      });
    } catch (e) { /* navegador sem suporte a áudio */ }

    if ('speechSynthesis' in window) {
      const fala = new SpeechSynthesisUtterance(`${c.paciente.nome}. ${c.medico.sala || 'Recepção'}.`);
      fala.lang = 'pt-BR';
      fala.rate = 0.9;
      setTimeout(() => speechSynthesis.speak(fala), 1300);
    }
  }

  $('btnSom').onclick = () => {
    somAtivo = !somAtivo;
    $('btnSom').setAttribute('aria-pressed', String(somAtivo));
    // Ondas sonoras quando ligado, "X" quando desligado
    $('iconeSom').setAttribute('d', somAtivo
      ? 'M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14'
      : 'M23 9l-6 6M17 9l6 6');
  };

  $('btnTela').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };

  // ---------- Controles somem quando o painel fica sem uso ----------
  let timerOcioso;
  function marcarAtividade() {
    document.body.classList.remove('ocioso');
    clearTimeout(timerOcioso);
    timerOcioso = setTimeout(() => document.body.classList.add('ocioso'), 4000);
  }
  ['mousemove', 'keydown', 'touchstart'].forEach(e => document.addEventListener(e, marcarAtividade, { passive: true }));
  marcarAtividade();

  // ---------- Relógio e avisos ----------
  function atualizarRelogio() {
    const agora = new Date();
    $('hora').textContent = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const data = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('data').textContent = data.charAt(0).toUpperCase() + data.slice(1);
  }

  let avisoAtual = 0;
  function trocarAviso() {
    const el = $('aviso');
    el.style.opacity = 0;
    setTimeout(() => {
      el.textContent = AVISOS[avisoAtual++ % AVISOS.length];
      el.style.opacity = 1;
    }, 500);
  }

  atualizarRelogio();
  setInterval(atualizarRelogio, 1000);
  trocarAviso();
  setInterval(trocarAviso, 9000);
  setInterval(carregarSalas, 60000); // garante sincronia mesmo sem eventos
  conectar();
</script>
</body>
</html>
